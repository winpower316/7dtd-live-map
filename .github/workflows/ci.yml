name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Python tests
        run: python -m unittest discover -s player-auth -p "test_*.py" -v
      - name: Public tree safety check
        run: |
          python scripts/check_public_tree.py
          python scripts/check_config_surface.py
      - name: Frontend JavaScript syntax check
        run: |
          node --check site/config.js
          node --check site/assets/maintenance.js
          node --check site/assets/app.js
          node --test scripts/test_maintenance.js
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./windows-agent/7dtd-live-map-agent.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Import-PowerShellDataFile `
            -LiteralPath ./windows-agent/config.example.psd1 |
            Out-Null
      - name: Compose configuration check
        run: docker compose --env-file .env.example config --quiet
      - name: Build frontend image
        run: docker build --tag 7dtd-live-map:test .
      - name: Frontend runtime configuration smoke test
        run: |
          docker run --detach --name 7dtd-live-map-test \
            --env SEVEN_DAYS_HOST=127.0.0.1 \
            --env FRONTEND_PLAYER_REFRESH_MS=12345 \
            --env FRONTEND_MAINTENANCE_TIME_ZONE=Asia/Tokyo \
            --env FRONTEND_MAINTENANCE_WINDOWS=09:00-09:20,23:00-23:20 \
            7dtd-live-map:test
          trap 'docker rm --force 7dtd-live-map-test' EXIT
          for attempt in 1 2 3 4 5; do
            if docker exec 7dtd-live-map-test \
              wget -q -O /tmp/config-response.js \
              http://127.0.0.1:8080/config.js; then
              break
            fi
            sleep 1
          done
          docker exec 7dtd-live-map-test \
            grep -F 'playerRefreshMs: "12345"' \
            /tmp/config-response.js
          docker exec 7dtd-live-map-test \
            grep -F 'maintenanceTimeZone: "Asia/Tokyo"' \
            /tmp/config-response.js
          docker exec 7dtd-live-map-test \
            grep -F 'maintenanceWindows: "09:00-09:20,23:00-23:20"' \
            /tmp/config-response.js
      - name: Build gateway image
        run: docker build --tag 7dtd-live-map-gateway:test player-auth

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
