services:
  player-auth:
    build:
      context: ./player-auth
    image: local/7dtd-player-auth:latest
    container_name: 7dtd-player-auth
    environment:
      - AUTH_USERNAME=${AUTH_USERNAME:-map}
      - MAX_FAILURES=${MAX_FAILURES:-5}
      - FAILURE_WINDOW_SECONDS=${FAILURE_WINDOW_SECONDS:-3600}
      - BLOCK_SECONDS=${BLOCK_SECONDS:-86400}
      - PBKDF2_ITERATIONS=${PBKDF2_ITERATIONS:-600000}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-262144}
      - MAX_MAP_ENTITIES=${MAX_MAP_ENTITIES:-500}
      - MAX_PLAYER_PROFILES=${MAX_PLAYER_PROFILES:-100}
      - PLAYER_UPSTREAM_URL=http://${SEVEN_DAYS_HOST}:${SEVEN_DAYS_WEB_PORT:-8080}/api/player
      - PLAYER_API_TOKEN_NAME=${PLAYER_API_TOKEN_NAME:-map-player-reader}
      - ACTIVITY_UPSTREAM_URL=http://${SEVEN_DAYS_HOST}:${SEVEN_DAYS_WEB_PORT:-8080}/api/log?count=-${ACTIVITY_LOG_COUNT:-500}
      - ACTIVITY_API_TOKEN_NAME=${ACTIVITY_API_TOKEN_NAME:-map-activity-reader}
      - ACTIVITY_POLL_SECONDS=${ACTIVITY_POLL_SECONDS:-10}
      - ACTIVITY_RETENTION_SECONDS=${ACTIVITY_RETENTION_SECONDS:-604800}
      - ACTIVITY_MAX_EVENTS=${ACTIVITY_MAX_EVENTS:-2000}
      - ACTIVITY_PUBLIC_LIMIT=${ACTIVITY_PUBLIC_LIMIT:-200}
      - RESTART_ENABLED=${RESTART_ENABLED:-false}
      - RESTART_DELAY_SECONDS=${RESTART_DELAY_SECONDS:-300}
      - RESTART_COOLDOWN_SECONDS=${RESTART_COOLDOWN_SECONDS:-1800}
      - RESTART_FAILURE_COOLDOWN_SECONDS=${RESTART_FAILURE_COOLDOWN_SECONDS:-300}
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${AGENT_PORT:-18081}:8080"
    networks:
      - player_map_backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - player_map_password_hash
      - restart_agent_token
      - player_api_token
      - activity_api_token
    volumes:
      - player_auth_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8080/health', timeout=2).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  7dtd-map:
    build:
      context: .
    image: local/7dtd-map:latest
    container_name: 7dtd-map
    environment:
      - SEVEN_DAYS_HOST=${SEVEN_DAYS_HOST}
      - SEVEN_DAYS_WEB_PORT=${SEVEN_DAYS_WEB_PORT:-8080}
      - VIRTUAL_HOST=${PUBLIC_HOST}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=${PUBLIC_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - FRONTEND_MAP_NATIVE_MAX_ZOOM=${FRONTEND_MAP_NATIVE_MAX_ZOOM:-4}
      - FRONTEND_MAP_TILE_SIZE=${FRONTEND_MAP_TILE_SIZE:-128}
      - FRONTEND_GAME_TIME_REFRESH_MS=${FRONTEND_GAME_TIME_REFRESH_MS:-10000}
      - FRONTEND_PLAYER_REFRESH_MS=${FRONTEND_PLAYER_REFRESH_MS:-10000}
      - FRONTEND_ACTIVITY_REFRESH_MS=${FRONTEND_ACTIVITY_REFRESH_MS:-10000}
      - FRONTEND_MAP_ENTITY_REFRESH_MS=${FRONTEND_MAP_ENTITY_REFRESH_MS:-10000}
      - FRONTEND_TRADER_EXPLORATION_REFRESH_MS=${FRONTEND_TRADER_EXPLORATION_REFRESH_MS:-5000}
      - FRONTEND_SERVER_VERSION_REFRESH_MS=${FRONTEND_SERVER_VERSION_REFRESH_MS:-60000}
      - FRONTEND_APP_VERSION_REFRESH_MS=${FRONTEND_APP_VERSION_REFRESH_MS:-60000}
      - FRONTEND_GAME_SCHEDULE_REFRESH_MS=${FRONTEND_GAME_SCHEDULE_REFRESH_MS:-60000}
      - FRONTEND_RESTART_STATUS_REFRESH_MS=${FRONTEND_RESTART_STATUS_REFRESH_MS:-5000}
      - FRONTEND_UNEXPLORED_TILE_MAX_BYTES=${FRONTEND_UNEXPLORED_TILE_MAX_BYTES:-400}
      - FRONTEND_TILE_RETRY_DELAYS_MS=${FRONTEND_TILE_RETRY_DELAYS_MS:-0,250,750,1500}
      - FRONTEND_CONFIG_RETRY_DELAYS_MS=${FRONTEND_CONFIG_RETRY_DELAYS_MS:-0,300,900}
      - FRONTEND_UNEXPLORED_TILE_REFRESH_MS=${FRONTEND_UNEXPLORED_TILE_REFRESH_MS:-5000}
      - FRONTEND_MOVING_PLAYER_MIN_SPEED_MPS=${FRONTEND_MOVING_PLAYER_MIN_SPEED_MPS:-4}
      - FRONTEND_MOVING_VEHICLE_MATCH_RADIUS=${FRONTEND_MOVING_VEHICLE_MATCH_RADIUS:-160}
      - FRONTEND_MOVING_VEHICLE_RELEASE_MS=${FRONTEND_MOVING_VEHICLE_RELEASE_MS:-20000}
      - NGINX_WORKER_CONNECTIONS=${NGINX_WORKER_CONNECTIONS:-1024}
      - NGINX_KEEPALIVE_TIMEOUT_SECONDS=${NGINX_KEEPALIVE_TIMEOUT_SECONDS:-30}
      - NGINX_TRUSTED_PROXY_CIDR=${NGINX_TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      - NGINX_UPSTREAM_KEEPALIVE=${NGINX_UPSTREAM_KEEPALIVE:-8}
      - NGINX_MAP_CACHE_KEYS_ZONE_SIZE=${NGINX_MAP_CACHE_KEYS_ZONE_SIZE:-16m}
      - NGINX_MAP_CACHE_MAX_SIZE=${NGINX_MAP_CACHE_MAX_SIZE:-2g}
      - NGINX_MAP_CACHE_INACTIVE=${NGINX_MAP_CACHE_INACTIVE:-7d}
      - NGINX_MAP_TILE_CACHE_MAX_AGE_SECONDS=${NGINX_MAP_TILE_CACHE_MAX_AGE_SECONDS:-60}
      - NGINX_MAP_TILE_STALE_SECONDS=${NGINX_MAP_TILE_STALE_SECONDS:-240}
      - NGINX_STATIC_CACHE_MAX_AGE_SECONDS=${NGINX_STATIC_CACHE_MAX_AGE_SECONDS:-604800}
      - NGINX_BIOME_CACHE_MAX_AGE_SECONDS=${NGINX_BIOME_CACHE_MAX_AGE_SECONDS:-3600}
      - NGINX_MAP_API_RATE=${NGINX_MAP_API_RATE:-20r/s}
      - NGINX_PLAYER_API_RATE=${NGINX_PLAYER_API_RATE:-10r/s}
      - NGINX_CONTROL_STATUS_RATE=${NGINX_CONTROL_STATUS_RATE:-10r/s}
      - NGINX_CONTROL_ACTION_RATE=${NGINX_CONTROL_ACTION_RATE:-1r/s}
      - NGINX_MAP_TILE_RATE=${NGINX_MAP_TILE_RATE:-200r/s}
      - NGINX_MAP_API_BURST=${NGINX_MAP_API_BURST:-50}
      - NGINX_PLAYER_API_BURST=${NGINX_PLAYER_API_BURST:-30}
      - NGINX_CONTROL_STATUS_BURST=${NGINX_CONTROL_STATUS_BURST:-30}
      - NGINX_CONTROL_ACTION_BURST=${NGINX_CONTROL_ACTION_BURST:-5}
      - NGINX_MAP_TILE_BURST=${NGINX_MAP_TILE_BURST:-500}
      - NGINX_PROXY_CONNECT_TIMEOUT_SECONDS=${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS:-3}
      - NGINX_MAP_API_READ_TIMEOUT_SECONDS=${NGINX_MAP_API_READ_TIMEOUT_SECONDS:-5}
      - NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS=${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS:-7}
      - NGINX_MAP_TILE_READ_TIMEOUT_SECONDS=${NGINX_MAP_TILE_READ_TIMEOUT_SECONDS:-10}
      - NGINX_CONTROL_MAX_BODY_SIZE=${NGINX_CONTROL_MAX_BODY_SIZE:-4k}
      - NGINX_MAP_CACHE_VALID_SECONDS=${NGINX_MAP_CACHE_VALID_SECONDS:-300}
      - NGINX_MAP_CACHE_NOT_FOUND_SECONDS=${NGINX_MAP_CACHE_NOT_FOUND_SECONDS:-30}
      - NGINX_MAP_CACHE_LOCK_TIMEOUT_SECONDS=${NGINX_MAP_CACHE_LOCK_TIMEOUT_SECONDS:-5}
    networks:
      - container_network
      - player_map_backend
    depends_on:
      player-auth:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - map_tile_cache:/var/cache/nginx/map
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  container_network:
    external: true
    name: ${PUBLIC_NETWORK_NAME:-container_network}
  player_map_backend:

secrets:
  player_map_password_hash:
    file: ./secrets/player-map.password-hash
  restart_agent_token:
    file: ./secrets/restart-agent.token
  player_api_token:
    file: ./secrets/player-api.token
  activity_api_token:
    file: ./secrets/activity-api.token

volumes:
  player_auth_data:
  map_tile_cache:
