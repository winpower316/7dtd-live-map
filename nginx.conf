worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections ${NGINX_WORKER_CONNECTIONS};
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_method $request_uri $status '
                    '$body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout ${NGINX_KEEPALIVE_TIMEOUT_SECONDS}s;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    proxy_cache_path /var/cache/nginx/map
        levels=1:2
        keys_zone=map_tiles_cache:${NGINX_MAP_CACHE_KEYS_ZONE_SIZE}
        max_size=${NGINX_MAP_CACHE_MAX_SIZE}
        inactive=${NGINX_MAP_CACHE_INACTIVE}
        use_temp_path=off;
    map $arg_live $map_tile_cache_bypass {
        default 0;
        "1" 1;
    }
    map $arg_live $map_tile_cache_control {
        default "public, max-age=${NGINX_MAP_TILE_CACHE_MAX_AGE_SECONDS}, stale-while-revalidate=${NGINX_MAP_TILE_STALE_SECONDS}";
        "1" "no-store";
    }

    set_real_ip_from ${NGINX_TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=map_api:10m rate=${NGINX_MAP_API_RATE};
    limit_req_zone $binary_remote_addr zone=player_api:10m rate=${NGINX_PLAYER_API_RATE};
    limit_req_zone $binary_remote_addr zone=control_status:10m rate=${NGINX_CONTROL_STATUS_RATE};
    limit_req_zone $binary_remote_addr zone=control_action:10m rate=${NGINX_CONTROL_ACTION_RATE};
    limit_req_zone $binary_remote_addr zone=map_tiles:10m rate=${NGINX_MAP_TILE_RATE};

    upstream seven_days_server {
        server ${SEVEN_DAYS_HOST}:${SEVEN_DAYS_WEB_PORT};
        keepalive ${NGINX_UPSTREAM_KEEPALIVE};
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream player_auth {
        zone player_auth 64k;
        server player-auth:8080 resolve;
        keepalive ${NGINX_UPSTREAM_KEEPALIVE};
    }

    server {
        listen 8080;
        server_name _;
        limit_req_status 429;

        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header_inherit merge;

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
        }

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }

        location = /version.json {
            limit_except GET {
                deny all;
            }

            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }

        location = /config.js {
            limit_except GET {
                deny all;
            }

            alias /tmp/frontend-config.js;
            default_type application/javascript;
            add_header Cache-Control "no-store" always;
        }

        location = /assets/app.js {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }

        location = /assets/styles.css {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }

        location = /favicon.svg {
            limit_except GET {
                deny all;
            }

            try_files $uri =404;
            add_header Cache-Control "public, max-age=${NGINX_STATIC_CACHE_MAX_AGE_SECONDS}, immutable" always;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=${NGINX_STATIC_CACHE_MAX_AGE_SECONDS}, immutable" always;
        }

        location = /api/map/config {
            limit_except GET {
                deny all;
            }

            limit_req zone=map_api burst=${NGINX_MAP_API_BURST} nodelay;
            proxy_pass http://seven_days_server/api/map/config;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host ${SEVEN_DAYS_HOST}:${SEVEN_DAYS_WEB_PORT};
            proxy_set_header Connection "";
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_MAP_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Cache-Control "no-store" always;
        }

        location = /api/serverstats {
            limit_except GET {
                deny all;
            }

            limit_req zone=map_api burst=${NGINX_MAP_API_BURST} nodelay;
            proxy_pass http://seven_days_server/api/serverstats;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host ${SEVEN_DAYS_HOST}:${SEVEN_DAYS_WEB_PORT};
            proxy_set_header Connection "";
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_MAP_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Cache-Control "no-store" always;
        }

        location = /api/player {
            limit_except GET {
                deny all;
            }

            limit_req zone=player_api burst=${NGINX_PLAYER_API_BURST} nodelay;
            proxy_pass http://player_auth/api/player;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host player-auth;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
        }

        location = /api/activity {
            limit_except GET {
                deny all;
            }

            limit_req zone=player_api burst=${NGINX_PLAYER_API_BURST} nodelay;
            proxy_pass http://player_auth/api/activity;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host player-auth;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
        }

        location = /api/map-entities {
            limit_except GET {
                deny all;
            }

            limit_req zone=player_api burst=${NGINX_PLAYER_API_BURST} nodelay;
            proxy_pass http://player_auth/api/map-entities;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host player-auth;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
        }

        location = /api/biome {
            limit_except GET {
                deny all;
            }

            limit_req zone=player_api burst=${NGINX_PLAYER_API_BURST} nodelay;
            proxy_pass http://player_auth/api/biome;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host player-auth;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Server;
            add_header Cache-Control "private, max-age=${NGINX_BIOME_CACHE_MAX_AGE_SECONDS}" always;
        }

        location = /api/server-status {
            limit_except GET {
                deny all;
            }

            limit_req zone=player_api burst=${NGINX_PLAYER_API_BURST} nodelay;
            proxy_pass http://player_auth/api/server-status;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host player-auth;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
        }

        location = /api/server-version {
            limit_except GET {
                deny all;
            }

            limit_req zone=map_api burst=${NGINX_MAP_API_BURST} nodelay;
            proxy_pass http://player_auth/api/server-version;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host player-auth;
            proxy_set_header Connection "";
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
        }

        location = /api/features {
            limit_except GET {
                deny all;
            }

            limit_req zone=map_api burst=${NGINX_MAP_API_BURST} nodelay;
            proxy_pass http://player_auth/api/features;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host player-auth;
            proxy_set_header Connection "";
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
        }

        location = /api/game-schedule {
            limit_except GET {
                deny all;
            }

            limit_req zone=map_api burst=${NGINX_MAP_API_BURST} nodelay;
            proxy_pass http://player_auth/api/game-schedule;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host player-auth;
            proxy_set_header Connection "";
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
        }

        location = /api/auth/check {
            limit_except GET {
                deny all;
            }

            limit_req zone=player_api burst=${NGINX_PLAYER_API_BURST} nodelay;
            proxy_pass http://player_auth/api/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host player-auth;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
        }

        location = /api/restart/status {
            limit_except GET {
                deny all;
            }

            limit_req zone=control_status burst=${NGINX_CONTROL_STATUS_BURST} nodelay;
            proxy_pass http://player_auth/api/restart/status;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host player-auth;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
        }

        location ~ "^/api/restart/(request|cancel)$" {
            limit_except POST {
                deny all;
            }

            limit_req zone=control_action burst=${NGINX_CONTROL_ACTION_BURST} nodelay;
            client_max_body_size ${NGINX_CONTROL_MAX_BODY_SIZE};
            proxy_pass http://player_auth;
            proxy_set_header Host player-auth;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_PRIVATE_API_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
        }

        location ~ "^/map/[0-4]/-?[0-9]{1,3}/-?[0-9]{1,3}\.png$" {
            limit_except GET {
                deny all;
            }

            limit_req zone=map_tiles burst=${NGINX_MAP_TILE_BURST} nodelay;
            proxy_pass http://seven_days_server;
            proxy_set_header Host ${SEVEN_DAYS_HOST}:${SEVEN_DAYS_WEB_PORT};
            proxy_set_header Connection "";
            proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT_SECONDS}s;
            proxy_read_timeout ${NGINX_MAP_TILE_READ_TIMEOUT_SECONDS}s;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Cache-Control;
            proxy_cache map_tiles_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_bypass $map_tile_cache_bypass;
            proxy_no_cache $map_tile_cache_bypass;
            proxy_cache_valid 200 ${NGINX_MAP_CACHE_VALID_SECONDS}s;
            proxy_cache_valid 404 ${NGINX_MAP_CACHE_NOT_FOUND_SECONDS}s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout ${NGINX_MAP_CACHE_LOCK_TIMEOUT_SECONDS}s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header X-Map-Cache $upstream_cache_status always;
            add_header Cache-Control $map_tile_cache_control always;
        }

        location / {
            return 404;
        }
    }
}
